# Local development stack: API + PostgreSQL + Redis.
#
# The API waits for both dependencies to report healthy, not merely to start,
# because a container that is "running" may still be seconds away from
# accepting connections — and the API fails fast when it cannot connect.

name: wms-saas

services:
  postgres:
    image: postgres:17-alpine
    container_name: wms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-wms}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-wms}
      POSTGRES_DB: ${DATABASE_NAME:-wms}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      # Bound to localhost only: the database must never be reachable from the
      # host's external network interfaces.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-wms} -d ${DATABASE_NAME:-wms}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [wms]

  redis:
    image: redis:7-alpine
    container_name: wms-redis
    restart: unless-stopped
    # appendonly yes gives Asynq durability: without it a restart drops every
    # queued job still waiting to be processed. noeviction ensures Redis never
    # silently discards a job to reclaim memory.
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [wms]

  # Runs migrations to completion, then exits. The API waits for it to succeed,
  # which guarantees the schema is current before the first request is served —
  # and means a failed migration blocks the deploy instead of producing an API
  # running against a half-migrated database.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrate
      args:
        VERSION: ${APP_VERSION:-dev}
    container_name: wms-migrate
    # One-shot job: never restart it. A retry loop on a failing migration would
    # repeatedly re-attempt a schema change that has already been diagnosed as
    # broken.
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-wms}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-wms}
      DATABASE_NAME: ${DATABASE_NAME:-wms}
      DATABASE_SSL_MODE: disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      # The migrate binary reaches Redis for nothing, but config validation
      # requires the host to be set.
      REDIS_HOST: redis
    command: ["up"]
    networks: [wms]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
      args:
        VERSION: ${APP_VERSION:-dev}
    container_name: wms-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_NAME: ${APP_NAME:-wms-saas}
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}

      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      HTTP_SHUTDOWN_TIMEOUT: 20s
      HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-*}

      # Service names resolve over the compose network. "localhost" inside a
      # container refers to the container itself, not to the host.
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-wms}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-wms}
      DATABASE_NAME: ${DATABASE_NAME:-wms}
      DATABASE_SSL_MODE: disable

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0

      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_FORMAT: ${LOG_FORMAT:-console}

      # No default is provided for the signing secret in production compose
      # files; the fallback here exists only so `docker compose up` works on a
      # fresh clone. Boot fails if it is shorter than 32 characters.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-development-only-secret-not-for-any-real-deployment}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-wms-saas}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-wms-saas-api}
      AUTH_JWT_ACCESS_TOKEN_TTL: ${AUTH_JWT_ACCESS_TOKEN_TTL:-15m}
      AUTH_JWT_REFRESH_TOKEN_TTL: ${AUTH_JWT_REFRESH_TOKEN_TTL:-168h}
      AUTH_PASSWORD_BCRYPT_COST: ${AUTH_PASSWORD_BCRYPT_COST:-12}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    # SIGTERM reaches the process so the graceful shutdown path gets its full
    # budget; the default 10s grace period would cut a 20s drain short.
    stop_signal: SIGTERM
    stop_grace_period: 30s
    # No healthcheck is declared here: the distroless runtime image ships no
    # shell and no curl, so probe the /health/ready endpoint from outside the
    # container (the orchestrator does this natively in production).
    networks: [wms]

volumes:
  postgres_data:
  redis_data:

networks:
  wms:
    driver: bridge
